name: Prueba iOS (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-proof
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Comprobar empaquetador
        run: python3 -m unittest discover -s tests -v
      - name: Compilar para iPhone y preparar paquete sin firmar
        run: bash scripts/build-ios.sh
      - name: Compilar también para simulador
        run: >-
          xcodebuild -project Galeria.xcodeproj -scheme Galeria
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/simulator CODE_SIGNING_ALLOWED=NO build
      - name: Guardar paquete (no instalable sin firma)
        uses: actions/upload-artifact@v4
        with:
          name: Galeria-unsigned
          path: build/Galeria-unsigned.ipa
          if-no-files-found: error
          retention-days: 3
