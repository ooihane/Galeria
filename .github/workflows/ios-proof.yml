name: Prueba iOS
on:
  push:
    branches: [main]
    paths:
      - 'Galeria/**'
      - 'GaleriaUITests/**'
      - 'Galeria.xcodeproj/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/ios-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-proof
  cancel-in-progress: true
jobs:
  build:
    if: ${{ github.event.repository.private == false }}
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Comprobar empaquetador
        run: python3 -m unittest discover -s tests -v
      - name: Compilar para iPhone y preparar paquete sin firmar
        run: bash scripts/build-ios.sh
      - name: Comprobar permiso de Fotos en simulador
        run: bash scripts/test-ios.sh
      - name: Resumen de la prueba de permisos
        if: always()
        run: |
          if [ -d build/PhotoPermission.xcresult ]; then
            echo '### Resultado de la prueba de Fotos' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            xcrun xcresulttool get test-results summary --path build/PhotoPermission.xcresult >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Guardar resultados del permiso
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PhotoPermission-results
          path: build/PhotoPermission.xcresult
          retention-days: 3
          if-no-files-found: ignore
      - name: Guardar paquete (no instalable sin firma)
        uses: actions/upload-artifact@v4
        with:
          name: Galeria-unsigned
          path: build/Galeria-unsigned.ipa
          if-no-files-found: error
          retention-days: 3
